<!DOCTYPE html>
<html lang="en" data-theme="dark_pure_athera">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pure Athera</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&display=swap"
      rel="stylesheet"
    />
    <link href="output.css" rel="stylesheet" />
    <style>
      .non-rounded-card {
        border-radius: 0 !important;
      }
    </style>
  </head>
  <body class="bg-base-200 font-mono">
    <div class="navbar bg-base-100">
      <div class="navbar-start">
        <div class="dropdown">
          <div tabindex="0" role="button" class="btn btn-ghost lg:hidden">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              class="h-5 w-5"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M4 6h16M4 12h8m-8 6h16"
              />
            </svg>
          </div>
          <ul
            tabindex="0"
            class="menu menu-sm dropdown-content bg-base-100 rounded-box z-[1] mt-3 w-52 p-2 shadow"
          >
            <li><a>Pricing</a></li>
            <li>
              <a>Contact Us</a>
            </li>
            <li>
              <details>
                <summary>Language</summary>
                <ul class="p-2">
                  <li><a>English</a></li>
                  <li><a>Kannada</a></li>
                  <li><a>Hindi</a></li>
                </ul>
              </details>
            </li>
          </ul>
        </div>
        <a class="btn btn-secondary font-extrabold non-rounded-card text-xl"
          ><i>Pure Athera</i></a
        >
      </div>
      <div class="navbar-center hidden lg:flex">
        <ul class="menu menu-horizontal">
          <li>
            <a class="btn btn-outline non-rounded-card btn-success mr-5"
              >Pricing</a
            >
          </li>
          <li><a class="btn btn-outline non-rounded-card">Contact Us</a></li>
        </ul>
      </div>
      <div class="navbar-end">
        <div class="navbar-center hidden lg:flex">
          <ul class="menu menu-horizontal px-1">
            <li>
              <details>
                <summary>Language</summary>
                <ul class="p-2">
                  <li><a>English</a></li>
                  <li><a>Hindi</a></li>
                  <li><a>Kannada</a></li>
                </ul>
              </details>
            </li>
          </ul>
        </div>
        <label class="grid cursor-pointer place-items-center">
          <input
            type="checkbox"
            value="pure_athera"
            class="toggle theme-controller bg-base-content col-span-2 col-start-1 row-start-1"
          />
          <svg
            class="stroke-base-100 fill-base-100 col-start-1 row-start-1"
            xmlns="http://www.w3.org/2000/svg"
            width="14"
            height="14"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>
          <svg
            class="stroke-base-100 fill-base-100 col-start-2 row-start-1"
            xmlns="http://www.w3.org/2000/svg"
            width="14"
            height="14"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <circle cx="12" cy="12" r="5" />
            <path
              d="M12 1v2M12 21v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M1 12h2M21 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"
            />
          </svg>
        </label>
      </div>
    </div>
  </body>
</html>
